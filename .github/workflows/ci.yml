name: San Nabilo Open-World CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    name: Lint, Unit Tests, Production Build & E2E Smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: TypeScript typecheck (lint)
        run: npm run lint

      - name: Run unit & integration tests
        run: npm test

      - name: Production Vite client bundle
        run: npm run build

      - name: Production Express + WebSocket server bundle
        run: npm run build:server

      - name: Install Playwright Chromium for E2E Smoke Test
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Smoke Test
        run: npm run test:e2e

      - name: Upload Playwright trace & screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-diagnostics
          path: |
            playwright-report/
            test-results/
          retention-days: 7
